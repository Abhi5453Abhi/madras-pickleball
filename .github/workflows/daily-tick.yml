# The scheduler tick, until the Vercel plan can run one itself.
#
# The confirmation gate fires three hours before a game and again an hour
# before it, and a game nobody ended ends itself half an hour after it was due
# to finish. Vercel's free plan runs a cron ONCE A DAY, which is not enough for
# any of that — and `app/vercel.json` therefore carries a daily schedule, which
# is all the free plan will accept.
#
# This fills the gap for nothing. GitHub's scheduler is best-effort and can run
# ten or twenty minutes late, which is fine: missing a tick costs time, not
# correctness, and a boundary whose moment has gone is recorded as missed
# rather than fired late.
#
# Set two repository secrets: MPB_URL (https://…) and MPB_CRON_SECRET (the same
# value as the CRON_SECRET environment variable on Vercel).
#
# Once the project is on Vercel Pro, change `app/vercel.json` to */10 * * * *
# and delete this file.

name: daily games tick

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: daily-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Run the reconciler
        env:
          MPB_URL: ${{ secrets.MPB_URL }}
          MPB_CRON_SECRET: ${{ secrets.MPB_CRON_SECRET }}
        run: |
          if [ -z "$MPB_URL" ] || [ -z "$MPB_CRON_SECRET" ]; then
            echo "MPB_URL or MPB_CRON_SECRET is not set — nothing to do."
            exit 0
          fi
          code=$(curl -sS -o /tmp/tick.json -w '%{http_code}' \
            -X POST "$MPB_URL/api/cron/tick" \
            -H "Authorization: Bearer $MPB_CRON_SECRET")
          cat /tmp/tick.json
          echo
          [ "$code" = "200" ]
